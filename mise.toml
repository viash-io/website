[tools]
node = "lts"
"npm:broken-link-checker" = "0.7.8"

[tasks."check-links:preview"]
description = "Check the local preview at http://localhost:8000/ for broken links"
run = "blc http://localhost:8000/ -ro"

[tasks."check-links:live"]
description = "Check https://viash.io/ for broken links"
run = "blc https://viash.io/ -ro"
