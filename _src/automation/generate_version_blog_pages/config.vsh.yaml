name: generate_version_blog_pages
description: |
  The script takes one or more changelog.md files and splits them into multiple quarto pages
  Some formatting is expected to extract titles, version number, etc.
arguments:
  - name: "--input"
    type: file
    alternatives: "-i"
    direction: input
    description: The changelog.md file(s) to use as input, e.g. one file per minor version
    required: true
    multiple: true
    must_exist: true
  - name: "--output"
    type: file
    alternatives: "-o"
    direction: output
    description: Base path to use to store the pages, should match 'blog/posts'
resources:
  - type: python_script
    path: script.py
  - path: template_blog_page.j2.qmd
test_resources:
  - type: bash_script
    path: test.sh
  - path: test_changelog.md
engines:
  - type: native
runners:
  - type: executable